<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Room Reservation</h1>

    <div class="btn-group mb-4" role="group" aria-label="Main navigation">
      <button class="btn btn-outline-primary" data-section="rooms">Rooms</button>
      <button class="btn btn-outline-primary" data-section="clients">Clients</button>
      <button class="btn btn-primary" data-section="reservations">Reservations</button>
    </div>

    <section id="rooms" class="section-content d-none">
      <h2>Rooms</h2>
      <p class="text-muted">Room management will be added later.</p>
    </section>

    <section id="clients" class="section-content d-none">
      <h2>Clients</h2>
      <p class="text-muted">Client management will be added later.</p>
    </section>

    <section id="reservations" class="section-content">
      <h2 class="mb-3">Reservations</h2>
      <div class="card">
        <div class="card-body">
          <form id="reservation-form" class="row g-3 mb-4">
            <div class="col-md-3">
              <label for="room" class="form-label">Room</label>
              <select id="room" class="form-select" required>
                <option value="">Select a room</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="client" class="form-label">Client</label>
              <select id="client" class="form-select" required>
                <option value="">Select a client</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="date_from" class="form-label">From</label>
              <input type="date" id="date_from" class="form-control" required>
            </div>
            <div class="col-md-2">
              <label for="date_to" class="form-label">To</label>
              <input type="date" id="date_to" class="form-control" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
          </form>

          <div class="table-responsive">
            <table class="table table-striped mb-0">
              <thead>
                <tr>
                  <th scope="col">Room</th>
                  <th scope="col">Client</th>
                  <th scope="col">From</th>
                  <th scope="col">To</th>
                </tr>
              </thead>
              <tbody id="reservations-list"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="message" class="alert alert-success mt-3 d-none" role="alert"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
