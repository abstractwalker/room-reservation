<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Room Reservation</h1>

    <div class="btn-group mb-4" role="group" aria-label="Main navigation">
      <button class="btn btn-outline-primary" data-section="rooms">Rooms</button>
      <button class="btn btn-outline-primary" data-section="clients">Clients</button>
      <button class="btn btn-primary" data-section="reservations">Reservations</button>
    </div>

    <section id="rooms" class="section-content d-none">
      <h2>Rooms</h2>
      <p class="text-muted">Room management will be added later.</p>
    </section>

    <section id="clients" class="section-content d-none">
      <h2>Clients</h2>
      <p class="text-muted">Client management will be added later.</p>
    </section>

    <section id="reservations" class="section-content">
      <h2 class="mb-3">Reservations</h2>
      <div class="card">
        <div class="card-body">
          <p class="text-muted">Create and view room reservations here.</p>
          <form id="reservation-form" class="row g-3">
            <div class="col-md-4">
              <label for="client" class="form-label">Client</label>
              <input type="text" class="form-control" id="client" placeholder="Client name">
            </div>
            <div class="col-md-4">
              <label for="room" class="form-label">Room</label>
              <input type="text" class="form-control" id="room" placeholder="Room name or number">
            </div>
            <div class="col-md-4">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date">
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary">Add reservation</button>
            </div>
          </form>
        </div>
      </div>

      <div id="message" class="alert alert-success mt-3 d-none" role="alert"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
